  <head>

    <title>F-14 Tomcat over San Diego (CesiumJS)</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body,
      #cesium {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #dfe8df;
        font-size: 15px;
        pointer-events: none;
        z-index: 10;
      }
      #loading.error {
        color: #ff9d9d;
        padding: 24px;
        text-align: center;
        white-space: pre-wrap;
      }
    </style>
